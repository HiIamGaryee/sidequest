<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Soft sticker drop shadow -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Thick Die-Cut Sticker Outline Contour (Purple/Indigo) -->
  <path
    d="M 52,18 
       C 58,16 66,16 72,20
       C 78,24 82,30 84,36
       C 88,34 94,36 98,40
       C 104,46 106,56 102,66
       C 106,72 108,82 104,90
       C 100,98 90,104 80,104
       C 72,104 64,102 56,104
       C 44,106 32,104 22,96
       C 14,88 12,76 14,64
       C 16,52 22,42 30,34
       C 36,28 44,20 52,18 Z"
    fill="#582be8"
    stroke="#3b15ad"
    stroke-width="3"
    stroke-linejoin="round"
    filter="url(#stickerShadow)"
  />

  <!-- Inner Sticker Body (Warm Sunburst Orange Fruit) -->
  <path
    d="M 50,22 
       C 56,20 64,20 69,24
       C 74,28 78,34 79,40
       C 80,44 80,50 80,56
       C 78,70 76,82 72,92
       C 68,98 58,100 48,100
       C 38,100 28,96 22,88
       C 16,80 16,68 18,58
       C 20,48 26,38 34,30
       C 40,24 46,23 50,22 Z"
    fill="#ff8f1f"
  />

  <!-- Top Fruit Stem & Leaf -->
  <path d="M 48,22 C 46,14 48,10 52,8" stroke="#5c3818" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 52,10 C 60,8 66,14 62,18 C 56,18 52,14 52,10 Z" fill="#40c057" />

  <!-- Orange Citrus Cute Smiley Face -->
  <!-- Eyes -->
  <ellipse cx="36" cy="56" rx="2.5" ry="3.5" fill="#341b09" />
  <ellipse cx="56" cy="56" rx="2.5" ry="3.5" fill="#341b09" />
  <!-- Cheeks -->
  <circle cx="30" cy="62" r="3.5" fill="#ff6b6b" opacity="0.6" />
  <circle cx="62" cy="62" r="3.5" fill="#ff6b6b" opacity="0.6" />
  <!-- Smile -->
  <path d="M 41,64 Q 46,70 51,64" stroke="#341b09" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- The Playful Kawaii Black Cat -->
  <!-- Cat Body & Head Silhouette -->
  <g>
    <!-- Left Ear -->
    <polygon points="76,38 72,25 83,32" fill="#18181b" stroke="#18181b" stroke-width="2" stroke-linejoin="round" />
    <polygon points="75,36 73,28 80,33" fill="#ff8787" />
    <!-- Right Ear -->
    <polygon points="94,38 103,26 99,39" fill="#18181b" stroke="#18181b" stroke-width="2" stroke-linejoin="round" />
    <polygon points="95,37 100,29 98,38" fill="#ff8787" />

    <!-- Cat Head -->
    <ellipse cx="86" cy="46" rx="14" ry="12" fill="#18181b" />

    <!-- Cat Body -->
    <path
      d="M 75,54 
         C 75,54 70,68 72,82
         C 74,92 84,96 92,94
         C 98,92 102,84 100,74
         C 98,64 95,54 95,54 Z"
      fill="#18181b"
    />

    <!-- Cat Tail -->
    <path
      d="M 98,82 C 105,82 109,74 106,66 C 104,64 101,65 102,68 C 104,73 100,77 96,77"
      stroke="#18181b"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Red Collar -->
    <path d="M 77,56 C 82,60 90,60 95,56" stroke="#e03131" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Tiny Bell/Tag -->
    <circle cx="86" cy="60" r="2" fill="#ffd43b" />

    <!-- Big Kawaii Round White Googly Eyes -->
    <circle cx="81" cy="45" r="4.5" fill="#ffffff" />
    <circle cx="91" cy="45" r="4.5" fill="#ffffff" />
    <!-- Pupils -->
    <circle cx="82" cy="45" r="2.2" fill="#000000" />
    <circle cx="92" cy="45" r="2.2" fill="#000000" />
    <!-- Catchlights -->
    <circle cx="80.5" cy="43.5" r="0.8" fill="#ffffff" />
    <circle cx="90.5" cy="43.5" r="0.8" fill="#ffffff" />

    <!-- Tiny Cat Nose & Mouth -->
    <polygon points="85.5,49 86.5,49 86,49.8" fill="#ff8787" />
    <path d="M 84,51 Q 86,52.5 88,51" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" />

    <!-- Paws resting over orange -->
    <ellipse cx="74" cy="68" rx="3.5" ry="2.5" fill="#18181b" />
  </g>

  <!-- Tiny Yellow Sparkle Star -->
  <path d="M 28,34 L 30,28 L 32,34 L 38,36 L 32,38 L 30,44 L 28,38 L 22,36 Z" fill="#ffd43b" opacity="0.9" />
</svg>
